# Checks every push, and builds YTFast (the app) and ytfast-check for the two
# computers YTFast targets. The builds are downloadable from the run's
# "Artifacts" section.
#
# Each action is pinned to the full commit of its release (the version is in
# the comment beside it), so a moved tag cannot change what builds the app.
# Dependabot (.github/dependabot.yml) proposes new versions.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Keep in step with rust-toolchain.toml.
  RUST_TOOLCHAIN: "1.98.0"

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            app: YTFast-for-Mac
            check: ytfast-check-macos-apple-silicon
          - name: Windows (Intel/AMD)
            os: windows-latest
            app: YTFast-for-Windows
            check: ytfast-check-windows
          - name: Linux (checks only)
            os: ubuntu-latest
            app: ""
            check: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --component rustfmt,clippy

      - name: Install audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked
        env:
          # "Start with the computer" writes the registry and reads it back,
          # under a key of its own: here, never on a person's computer.
          YTFAST_TEST_REGISTRY: "1"

      - name: Build
        if: matrix.app != ''
        run: cargo build --release --locked -p ytfast -p ytfast-check

      # The app as YTFast.app, with its icon, signed "ad hoc" (there is no
      # Apple developer account), so macOS runs it once it is allowed in
      # Privacy & Security; in a disk image (YTFast.dmg) beside a shortcut
      # to Applications, to drag it into. The disk image and tar keep the
      # "this is a program" permission that a plain zip loses.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/app dist/check
          app=dist/YTFast.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/ytfast "$app/Contents/MacOS/ytfast"
          cp packaging/macos/Info.plist "$app/Contents/Info.plist"
          iconset="$RUNNER_TEMP/YTFast.iconset"
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            double=$((size * 2))
            sips -z "$size" "$size" packaging/icons/macos-1024.png --out "$iconset/icon_${size}x${size}.png" > /dev/null
            sips -z "$double" "$double" packaging/icons/macos-1024.png --out "$iconset/icon_${size}x${size}@2x.png" > /dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/YTFast.icns"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          # The disk image, made the long way round: an empty one three
          # times the app's size (and 20 MB more), the app and a shortcut
          # to Applications copied in, then compressed. Made straight from
          # a folder (-srcfolder), it came out unreadable on CI's Macs from
          # the build after 0.6.5 on, every time.
          blank="$RUNNER_TEMP/blank.dmg"
          inside="$RUNNER_TEMP/blank"
          size=$(( $(du -sm "$app" | cut -f1) * 3 + 20 ))
          rm -f "$blank" dist/app/YTFast.dmg
          hdiutil create -size "${size}m" -fs HFS+ -volname YTFast "$blank"
          hdiutil attach -nobrowse -noautoopen -mountpoint "$inside" "$blank"
          ditto "$app" "$inside/YTFast.app"
          ln -s /Applications "$inside/Applications"
          sync
          # The volume can be busy for a moment (Spotlight): try again.
          for try in 1 2 3; do
            hdiutil detach "$inside" && break
            sleep 3
          done
          if [ -d "$inside/YTFast.app" ]; then hdiutil detach -force "$inside"; fi
          hdiutil convert "$blank" -format UDZO -o dist/app/YTFast.dmg
          if ! hdiutil verify dist/app/YTFast.dmg; then
            # What came out, to tell why.
            ls -l dist/app/YTFast.dmg
            tail -c 512 dist/app/YTFast.dmg | xxd | head -4
            hdiutil imageinfo dist/app/YTFast.dmg 2>&1 | head -20 || true
            exit 1
          fi
          # The app in the disk image is still whole and signed.
          mount="$RUNNER_TEMP/disk-image-mounted"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" dist/app/YTFast.dmg
          codesign --verify --deep --strict "$mount/YTFast.app"
          hdiutil detach "$mount"
          cp docs/run-the-app.md dist/app/HOW-TO-RUN.md
          cp THIRD-PARTY-NOTICES.txt dist/app/
          tar -C target/release -czf dist/check/ytfast-check-macos.tar.gz ytfast-check
          cp docs/run-the-check.md dist/check/HOW-TO-RUN.md
          cp THIRD-PARTY-NOTICES.txt dist/check/

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist/app dist/check
          cp target/release/ytfast.exe dist/app/YTFast.exe
          cp docs/run-the-app.md dist/app/HOW-TO-RUN.md
          cp THIRD-PARTY-NOTICES.txt dist/app/
          cp target/release/ytfast-check.exe dist/check/
          cp docs/run-the-check.md dist/check/HOW-TO-RUN.md
          cp THIRD-PARTY-NOTICES.txt dist/check/

      # The installer (packaging/windows/ytfast.iss): YTFast as an app, in
      # the user's own Programs folder, the Start menu and Settings > Apps.
      # Inno Setup comes with GitHub's Windows machines. PowerShell, as bash
      # on Windows reads the /D... arguments as paths. Saved under the name
      # the updater looks for (ytfast-v<version>-...-setup.exe) and as
      # YTFast-Setup.exe, the download people choose.
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DVersion=$version" "/DBinary=$PWD\target\release\ytfast.exe" `
            "/DNotices=$PWD\THIRD-PARTY-NOTICES.txt" "/DOutputDir=$PWD\dist\setup" `
            packaging\windows\ytfast.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "dist\setup\ytfast-v$version-x86_64-pc-windows-msvc-setup.exe" dist\app\YTFast-Setup.exe

      # The installer installs (the program, its shortcuts, its entry in
      # Settings > Apps), the program installed runs, and the uninstaller
      # takes it all away, "Start with the computer" too: on GitHub's
      # machine, never on a person's.
      - name: Installer test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\YTFast'
          $start = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\YTFast.lnk'
          $desktop = Join-Path ([Environment]::GetFolderPath('Desktop')) 'YTFast.lnk'
          $apps = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{E5C965A4-1C85-441A-8585-6AE2BA46004E}_is1'
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $log = Join-Path $env:RUNNER_TEMP 'install.log'
          $setup = Start-Process dist\app\YTFast-Setup.exe -Wait -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$log"
          if ($setup.ExitCode -ne 0) { Get-Content $log; throw "the installer failed: $($setup.ExitCode)" }
          foreach ($file in "$dir\YTFast.exe", "$dir\ytfast-installer.txt", "$dir\THIRD-PARTY-NOTICES.txt", $start, $desktop) {
            if (-not (Test-Path $file)) { throw "not there after installing: $file" }
          }
          if (-not (Test-Path $apps)) { throw 'not in Settings > Apps' }
          "Settings > Apps: $((Get-ItemProperty $apps).DisplayName) $((Get-ItemProperty $apps).DisplayVersion)"
          $said = Join-Path $env:RUNNER_TEMP 'version.txt'
          Start-Process "$dir\YTFast.exe" -ArgumentList '--version' -RedirectStandardOutput $said -NoNewWindow -Wait
          if ((Get-Content $said) -notmatch '^ytfast \d') { throw "the program installed said: $(Get-Content $said)" }
          # As "Start with the computer" leaves it.
          New-Item -Force $run | Out-Null
          New-ItemProperty -Force -Path $run -Name YTFast -Value "`"$dir\YTFast.exe`" --hidden" | Out-Null
          # The uninstaller hands over to a copy of itself and returns: its
          # work is done once the folder is gone.
          Start-Process "$dir\unins000.exe" -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          for ($i = 0; $i -lt 60 -and (Test-Path $dir); $i++) { Start-Sleep -Milliseconds 500 }
          foreach ($file in $dir, $start, $desktop) {
            if (Test-Path $file) { throw "still there after uninstalling: $file" }
          }
          if (Test-Path $apps) { throw 'still in Settings > Apps' }
          if ((Get-ItemProperty $run).YTFast) { throw 'still starting with the computer' }
          'installed, ran and uninstalled'

      - name: Upload the app
        if: matrix.app != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.app }}
          path: dist/app/
          retention-days: 30

      - name: Upload the check
        if: matrix.check != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.check }}
          path: dist/check/
          retention-days: 30
