[package]
name = "ytfast"
description = "YouTube Music, native and fast"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "ytfast"
path = "src/main.rs"

[dependencies]
ytfast-core = { path = "../ytfast-core" }
anyhow = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
# Blocking, for the updater's thread (fastframe-update's transport).
reqwest = { version = "0.12", default-features = false, features = ["blocking"] }
# Updates from YTFast's GitHub releases, as Spotifast's: signed, checked,
# installed by a helper while YTFast is closed, and rolled back if the new
# version will not start.
fastframe-update = { git = "https://github.com/crmne/fastframe", tag = "v0.5.0", features = ["reqwest"] }
# The Mac's own updates (update_mac.rs): the release's signature and the
# disk image's checksum, checked as fastframe-update checks them (the same
# libraries and versions).
ring = "0.17"
sha2 = "0.10"
directories = "6"
# The window, as in Spotifast: glow keeps the binary and the build small;
# a 2D music app needs no wgpu. AccessKit gives screen readers the controls.
eframe = { version = "0.36", default-features = false, features = ["accesskit", "glow", "default_fonts", "wayland", "x11", "persistence"] }
egui = "0.36"
# SVG icons (fastframe-icons serves them through this loader).
egui_extras = { version = "0.36", features = ["svg"] }
# Album covers: YouTube serves JPEG and WebP.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# Spotifast's shared foundation, at the version Spotifast uses (0.5.0).
# Interface font (Inter), following the desktop's font rendering.
fastframe-fonts = { git = "https://github.com/crmne/fastframe", tag = "v0.5.0" }
fastframe-text = { git = "https://github.com/crmne/fastframe", tag = "v0.5.0" }
# Icons (Lucide), shared and our own.
fastframe-icons = { git = "https://github.com/crmne/fastframe", tag = "v0.5.0" }
# Media keys and the system's Now Playing panel (macOS) / media overlay
# (Windows).
fastframe-now-playing = { git = "https://github.com/crmne/fastframe", tag = "v0.5.0" }
# Scrolling that feels like the platform's.
fastframe-scroll = { git = "https://github.com/crmne/fastframe", tag = "v0.5.0" }
# Running on with the window closed, as Spotifast does: the loop that makes
# a new window when one is wanted (shell), the icon by the clock (tray), and
# one YTFast at a time, a second launch showing the first (instance).
fastframe-shell = { git = "https://github.com/crmne/fastframe", tag = "v0.5.0" }
fastframe-tray = { git = "https://github.com/crmne/fastframe", tag = "v0.5.0" }
fastframe-instance = { git = "https://github.com/crmne/fastframe", tag = "v0.5.0" }
# The settings and the queue saved while no window is open (`store`): in
# eframe's own file and format (RON), written whole or not at all.
fastframe-file = { git = "https://github.com/crmne/fastframe", tag = "v0.5.0" }
ron = "0.12"

[target.'cfg(windows)'.dependencies]
# "Start with the computer": the registry's Run list (`login`).
winreg = "0.56"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
# The icon and name in the Windows program file.
embed-resource = "3"

[lints]
workspace = true
