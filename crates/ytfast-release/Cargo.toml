[package]
name = "ytfast-release"
description = "Makes YTFast's release files: the downloads (YTFast.exe, YTFast.dmg), the Windows update archive, checksums.txt and its signature; and the update signing key"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
# Ed25519, as fastframe-update verifies (the same library and version).
ring = "0.17"
sha2 = "0.10"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
