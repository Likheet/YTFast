[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Audio decoding is too slow at opt-level 0 to listen to while developing.
# Dependencies stay optimized; our own crates stay quick to rebuild.
[profile.dev.package."*"]
opt-level = 2
